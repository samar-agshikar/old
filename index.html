<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samar Agshikar — Building What's Next</title>
  <meta
    name="description"
    content="Samar Agshikar — Student, software developer, and aspiring entrepreneur building THE 1, Kerniq, and writing Building What's Next."
  />
  <meta name="theme-color" content="#040714" />

  <!-- Ensure page always starts cleanly at the top when opened -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    if (!window.location.hash) {
      window.scrollTo(0, 0);
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =====================================================================
       1. THEME TOKENS — DARK MODE (NAVY, PURPLE, RED)
          & LIGHT MODE (ORANGE, RED, YELLOW, GREEN)
    ===================================================================== */
    :root,
    [data-theme="dark"] {
      --bg-page: #040714;
      --glass-bg: rgba(12, 20, 48, 0.52);
      --glass-bg-strong: rgba(10, 17, 42, 0.78);
      --glass-pill: rgba(13, 22, 54, 0.68);
      --glass-hover: rgba(255, 255, 255, 0.075);

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #8b9cc0;

      --border-glass: rgba(255, 255, 255, 0.14);
      --border-glass-strong: rgba(255, 255, 255, 0.24);
      --specular-top: inset 0 1px 0 0 rgba(255, 255, 255, 0.22);

      --grid-line: rgba(255, 255, 255, 0.065);
      --track-line: rgba(255, 255, 255, 0.16);
      --stem-line: rgba(255, 255, 255, 0.24);
      --stem-active: #c084fc;

      /* Dark Mode Signature Palette: Navy Blue, Purple, Red */
      --grad-primary: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 52%, #e11d48 100%);
      --grad-text: linear-gradient(115deg, #60a5fa 0%, #c084fc 50%, #fb7185 100%);
      --grad-bar: linear-gradient(90deg, #2563eb 0%, #9333ea 52%, #f43f5e 100%);
      --accent-1: #60a5fa;
      --accent-2: #c084fc;
      --accent-3: #fb7185;

      /* High-contrast SA monogram badge */
      --logo-bg: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 55%, #be123c 100%);
      --logo-fg: #ffffff;
      --logo-border: rgba(255, 255, 255, 0.28);

      --cta-bg: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 52%, #e11d48 100%);
      --cta-text: #ffffff;
      --cta-shadow: 0 14px 36px -8px rgba(124, 58, 237, 0.55);

      --ambient-mesh:
        radial-gradient(circle at 14% 12%, rgba(30, 58, 138, 0.52) 0%, transparent 48%),
        radial-gradient(circle at 84% 18%, rgba(109, 40, 217, 0.42) 0%, transparent 46%),
        radial-gradient(circle at 72% 62%, rgba(190, 18, 60, 0.32) 0%, transparent 50%),
        radial-gradient(circle at 22% 78%, rgba(37, 99, 235, 0.34) 0%, transparent 52%);

      --shadow-glass: 0 28px 70px -18px rgba(2, 6, 23, 0.85);
    }

    [data-theme="light"] {
      --bg-page: #fffcf7;
      --glass-bg: rgba(255, 255, 255, 0.66);
      --glass-bg-strong: rgba(255, 255, 255, 0.88);
      --glass-pill: rgba(255, 255, 255, 0.82);
      --glass-hover: rgba(15, 23, 42, 0.055);

      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;

      --border-glass: rgba(15, 23, 42, 0.11);
      --border-glass-strong: rgba(15, 23, 42, 0.2);
      --specular-top: inset 0 1px 0 0 rgba(255, 255, 255, 0.95);

      --grid-line: rgba(15, 23, 42, 0.075);
      --track-line: rgba(15, 23, 42, 0.18);
      --stem-line: rgba(15, 23, 42, 0.24);
      --stem-active: #ea580c;

      /* Light Mode Signature Palette: Orange, Red, Yellow, Green */
      --grad-primary: linear-gradient(135deg, #f97316 0%, #ef4444 35%, #eab308 70%, #10b981 100%);
      --grad-text: linear-gradient(115deg, #ea580c 0%, #e11d48 36%, #ca8a04 70%, #059669 100%);
      --grad-bar: linear-gradient(90deg, #f97316 0%, #ef4444 35%, #eab308 70%, #10b981 100%);
      --accent-1: #ea580c;
      --accent-2: #e11d48;
      --accent-3: #059669;

      /* High-contrast SA monogram badge in Light Mode */
      --logo-bg: #0f172a;
      --logo-fg: #ffffff;
      --logo-border: rgba(234, 88, 12, 0.65);

      --cta-bg: linear-gradient(135deg, #f97316 0%, #ef4444 50%, #10b981 100%);
      --cta-text: #ffffff;
      --cta-shadow: 0 14px 34px -8px rgba(249, 115, 22, 0.42);

      --ambient-mesh:
        radial-gradient(circle at 12% 14%, rgba(251, 146, 60, 0.32) 0%, transparent 46%),
        radial-gradient(circle at 86% 16%, rgba(244, 63, 94, 0.24) 0%, transparent 45%),
        radial-gradient(circle at 52% 48%, rgba(250, 204, 21, 0.25) 0%, transparent 48%),
        radial-gradient(circle at 80% 82%, rgba(16, 185, 129, 0.26) 0%, transparent 50%),
        radial-gradient(circle at 18% 84%, rgba(249, 115, 22, 0.22) 0%, transparent 48%);

      --shadow-glass: 0 24px 60px -16px rgba(234, 88, 12, 0.14);
    }

    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --container: 1220px;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
      --bounce-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: clip;
    }

    body {
      position: relative;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.65;
      overflow-x: clip;
      transition: background-color 0.45s var(--spring), color 0.35s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 clamp(20px, 4vw, 44px);
    }

    /* =====================================================================
       2. AMBIENT GRADIENT FIELD & GLASSMORPHISM SURFACES
    ===================================================================== */
    .ambient-field {
      position: fixed;
      inset: -12%;
      z-index: 0;
      pointer-events: none;
      background-image: var(--ambient-mesh);
      filter: blur(42px);
      animation: auroraFloat 18s ease-in-out infinite alternate;
    }

    @keyframes auroraFloat {
      0% { transform: translate3d(-1.5%, -1.5%, 0) scale(1); }
      50% { transform: translate3d(1.8%, 1.2%, 0) scale(1.04); }
      100% { transform: translate3d(-0.8%, 2%, 0) scale(1.02); }
    }

    main,
    header,
    footer {
      position: relative;
      z-index: 1;
    }

    .glass-panel {
      position: relative;
      background: var(--glass-bg);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      box-shadow: var(--specular-top), var(--shadow-glass);
      transition:
        transform 0.35s var(--spring),
        border-color 0.3s ease,
        background-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .glass-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255, 255, 255, 0.14),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .glass-panel:hover::after {
      opacity: 1;
    }

    [data-reveal] {
      opacity: 0;
      filter: blur(8px);
      transform: translate3d(0, 22px, 0) scale(0.985);
      transition:
        opacity 0.75s var(--spring),
        filter 0.75s var(--spring),
        transform 0.75s var(--spring);
      transition-delay: var(--delay, 0ms);
    }

    [data-reveal].is-visible {
      opacity: 1;
      filter: blur(0px);
      transform: translate3d(0, 0, 0) scale(1);
    }

    /* =====================================================================
       3. ANIMATED GLASSMORPHIC TOP DOCK (LIVE SCROLL TRACKER)
    ===================================================================== */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 150;
      padding: 14px 0;
      pointer-events: none;
    }

    .top-dock-shell {
      pointer-events: auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 12px 8px 14px;
      border-radius: 999px;
      background: var(--glass-pill);
      border: 1px solid var(--border-glass-strong);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      box-shadow:
        var(--specular-top),
        0 18px 46px -12px rgba(2, 6, 23, 0.45);
      overflow: hidden;
    }

    .dock-progress-track {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 0;
      height: 2.5px;
      background: rgba(128, 128, 128, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .dock-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--grad-bar);
      border-radius: 999px;
      transition: width 0.08s linear;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .brand-monogram {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1.5px solid var(--logo-border);
      background: var(--logo-bg);
      color: var(--logo-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .dock-nav {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.06);
      border: 1px solid var(--border-glass);
    }

    .nav-active-pill {
      position: absolute;
      top: 3px;
      left: 3px;
      height: calc(100% - 6px);
      width: 74px;
      border-radius: 999px;
      background: var(--grad-primary);
      box-shadow: 0 6px 20px -4px rgba(124, 58, 237, 0.45);
      transition:
        transform 0.48s var(--bounce-spring),
        width 0.42s var(--spring);
      z-index: 0;
      pointer-events: none;
    }

    .dock-nav a {
      position: relative;
      z-index: 1;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: color 0.25s ease;
      white-space: nowrap;
    }

    .dock-nav a:hover {
      color: var(--text-primary);
    }

    .dock-nav a.active {
      color: #ffffff;
    }

    .dock-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .dock-location-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--glass-hover);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .icon-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--glass-hover);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.3s var(--bounce-spring), border-color 0.2s ease;
    }

    .icon-btn:hover {
      transform: scale(1.08);
      border-color: var(--border-glass-strong);
    }

    .nav-cta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--cta-bg);
      color: var(--cta-text);
      box-shadow: var(--cta-shadow);
      transition: transform 0.3s var(--bounce-spring);
    }

    .nav-cta-pill:hover {
      transform: translateY(-1.5px) scale(1.03);
    }

    .mobile-toggle {
      display: none;
    }

    .mobile-menu {
      pointer-events: auto;
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 20px;
      background: var(--glass-bg-strong);
      border: 1px solid var(--border-glass-strong);
      backdrop-filter: blur(28px) saturate(180%);
      box-shadow: var(--shadow-glass);
      flex-direction: column;
      gap: 4px;
    }

    .mobile-menu.open {
      display: flex;
    }

    .mobile-menu a {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .mobile-menu a.active,
    .mobile-menu a:hover {
      background: var(--grad-primary);
      color: #ffffff;
    }

    /* =====================================================================
       4. HERO SECTION + NATURAL-FLOW AUTO-SWITCHER (NO SCREEN STOP)
    ===================================================================== */
    .hero-section {
      position: relative;
      padding: 124px 0 88px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.06fr 0.94fr;
      gap: 44px;
      align-items: center;
      margin-bottom: 64px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(18px);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--grad-primary);
      box-shadow: 0 0 12px var(--accent-2);
    }

    .hero-title {
      font-size: clamp(3rem, 5.6vw, 4.8rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    .hero-title .italic-gradient {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.01em;
      background: var(--grad-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 1.05rem;
      line-height: 1.74;
      color: var(--text-secondary);
      max-width: 52ch;
      margin-bottom: 28px;
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-luminous {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      background: var(--cta-bg);
      color: var(--cta-text);
      box-shadow: var(--cta-shadow);
      transition: transform 0.35s var(--bounce-spring);
      cursor: pointer;
      border: none;
    }

    .btn-luminous:hover {
      transform: translateY(-2.5px) scale(1.02);
    }

    .btn-glass {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--glass-bg);
      border: 1px solid var(--border-glass-strong);
      backdrop-filter: blur(20px) saturate(170%);
      box-shadow: var(--specular-top);
      transition: transform 0.35s var(--bounce-spring), border-color 0.25s ease;
      cursor: pointer;
    }

    .btn-glass:hover {
      transform: translateY(-2px);
      border-color: var(--accent-2);
    }

    .hero-footnote {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .hero-mono-bar {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(18px);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .hero-right-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .hero-orb-float {
      width: 100%;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #heroWebGLOrb {
      width: 220px;
      height: 220px;
      filter: drop-shadow(0 18px 34px rgba(124, 58, 237, 0.32));
    }

    .hero-preview-card {
      width: 100%;
      border-radius: 24px;
      padding: 22px;
    }

    .preview-card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-glass);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .preview-dots {
      display: flex;
      gap: 6px;
    }

    .preview-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--grad-primary);
    }

    .preview-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 15px;
      border-radius: 14px;
      background: var(--glass-hover);
      border: 1px solid var(--border-glass);
      font-size: 0.84rem;
      transition: transform 0.3s var(--spring), border-color 0.25s ease;
    }

    .preview-row:hover {
      transform: translateX(4px);
      border-color: var(--border-glass-strong);
    }

    .preview-row strong {
      font-weight: 700;
      color: var(--text-primary);
    }

    .preview-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      color: #ffffff;
      background: var(--grad-primary);
      flex-shrink: 0;
    }

    /* Natural-Flow Auto-Clicking 2-Tab Feature Switcher */
    .hero-switcher-wrap {
      padding-top: 16px;
    }

    .hero-switcher-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 620px;
      margin: 0 auto 18px;
    }

    .switcher-tab {
      position: relative;
      overflow: hidden;
      text-align: left;
      padding: 15px 20px 18px;
      border-radius: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(22px) saturate(170%);
      cursor: pointer;
      transition:
        transform 0.35s var(--bounce-spring),
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .switcher-tab:hover {
      transform: translateY(-2px);
    }

    .switcher-tab.active {
      border-color: var(--accent-2);
      transform: translateY(-2px) scale(1.015);
      box-shadow: var(--specular-top), 0 14px 32px -10px rgba(124, 58, 237, 0.38);
    }

    .tab-dwell-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0%;
      background: var(--grad-bar);
      transition: width 0.12s linear;
    }

    .switcher-tab-title {
      display: block;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .switcher-tab-sub {
      display: block;
      font-size: 0.77rem;
      color: var(--text-muted);
    }

    .hero-showcase-frame {
      border-radius: 24px;
      padding: clamp(24px, 3.4vw, 36px);
      overflow: hidden;
    }

    .showcase-frame-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 32px;
      align-items: center;
      animation: cardMorphIn 0.5s var(--spring);
    }

    @keyframes cardMorphIn {
      0% {
        opacity: 0;
        filter: blur(6px);
        transform: translate3d(0, 14px, 0) scale(0.988);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .showcase-copy h3 {
      font-size: 1.42rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .showcase-copy p {
      font-size: 0.94rem;
      color: var(--text-secondary);
      line-height: 1.72;
      margin-bottom: 16px;
    }

    .showcase-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .showcase-pills span {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--glass-hover);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
    }

    .showcase-mock {
      padding: 18px;
      border-radius: 16px;
      background: var(--glass-hover);
      border: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--border-glass);
      font-size: 0.83rem;
    }

    /* =====================================================================
       5. RECOGNITION & HIGHLIGHTS STRIP
    ===================================================================== */
    .recognition-section {
      padding: 64px 0 88px;
      border-top: 1px solid var(--border-glass);
      border-bottom: 1px solid var(--border-glass);
    }

    .recognition-top {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 28px;
      align-items: center;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border-glass);
      margin-bottom: 28px;
    }

    .rec-stat-num {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      background: var(--grad-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rec-stat-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .rec-logos {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .rec-badge {
      padding: 15px 12px;
      border-radius: 14px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .rec-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .rec-card {
      padding: 24px;
      border-radius: 18px;
    }

    .rec-card-kicker {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--grad-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      margin-bottom: 8px;
    }

    .rec-card p {
      font-size: 0.9rem;
      line-height: 1.64;
      color: var(--text-secondary);
    }

      backdrop-filter: blur(20px);
      box-shadow: var(--specular-top);

      align-items: center;

      transition: transform 0.2s ease, background-color 0.2s ease;
